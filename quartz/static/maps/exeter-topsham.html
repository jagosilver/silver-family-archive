<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exeter and Topsham family map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>html,body,#map{height:100%;margin:0;font-family:Georgia,serif}
.num{background:#8a2b0e;color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;line-height:24px;text-align:center;font:bold 13px Helvetica,Arial,sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.num.approx{background:#fff;color:#8a2b0e;border-color:#8a2b0e}
.leaflet-popup-content{font-size:14px;line-height:1.4}.leaflet-popup-content h3{margin:0 0 4px;font-size:15px}
.leaflet-popup-content .when{color:#666;font-size:12px;margin-bottom:6px}.leaflet-popup-content a{color:#8a2b0e}</style>
</head><body><div id="map"></div><script>
const places = [{"n": 1, "lat": 50.7318, "lon": -3.5269, "approx": false, "name": "Tresillian, West Avenue", "area": "Exeter", "years": "1899–c.1950", "text": "The Silver family home: Clifford and Gladys brought up their children here. Shot up in the Exeter Blitz, May 1942, and still standing.", "links": "<a href=\"../../Clifford-Marking-Silver/#tresillian\" target=\"_top\">Clifford Marking Silver</a> · <a href=\"../../David-Silver/#tresillian-and-the-exeter-blitz\" target=\"_top\">David Silver</a>"}, {"n": 2, "lat": 50.73, "lon": -3.5295, "approx": true, "name": "Higher Barracks", "area": "Exeter", "years": "1942", "text": "\"Part of the barracks, full of the army, about 300 yards away from our house\" was destroyed in an air raid David watched as a warden in 1942.", "links": "<a href=\"../../WWII-Interview\" target=\"_top\">David's WWII tape</a>"}, {"n": 3, "lat": 50.724, "lon": -3.5282, "approx": false, "name": "Bedford Circus", "area": "Exeter", "years": "c.1906–1942", "text": "Clifford's dental surgery stood here \"until 1942\". The Georgian circus was gutted in the Blitz and later demolished; Princesshay now covers the site.", "links": "<a href=\"../../Clifford-Marking-Silver/#the-dental-practice\" target=\"_top\">Clifford Marking Silver</a>"}, {"n": 4, "lat": 50.7252, "lon": -3.5321, "approx": false, "name": "Exeter School of Art (Royal Albert Memorial Museum building)", "area": "Exeter", "years": "1942–43", "text": "David spent about two terms at the Exeter School of Art before joining the RAF.", "links": "<a href=\"../../David-Silver/#exeter-and-the-war\" target=\"_top\">David Silver</a>"}, {"n": 5, "lat": 50.7194, "lon": -3.5157, "approx": false, "name": "Mona Lodge, Lyndhurst Road", "area": "Exeter (St Leonards)", "years": "c.1900–1921", "text": "Rupert Philip Acott's house, with lions on the gateposts, and Gladys's childhood home. Muriel Acott was married from here. Still standing.", "links": "<a href=\"../../Acott-Family/#rupert-philip-acott-18531941-and-charlotte-rowell\" target=\"_top\">The Acott Family</a> · <a href=\"../../Gladys-Silver/\" target=\"_top\">Gladys Silver</a>"}, {"n": 6, "lat": 50.7298, "lon": -3.5367, "approx": false, "name": "Velwell Road, St David's", "area": "Exeter", "years": "c.1951–1960s", "text": "Clifford and Gladys's home after Tresillian. David saved the family photographs from here \"when my mother died\".", "links": "<a href=\"../../Clifford-Marking-Silver/\" target=\"_top\">Clifford Marking Silver</a> · <a href=\"../../Bristol-Letters\" target=\"_top\">Letters from Bristol</a>"}, {"n": 7, "lat": 50.7274, "lon": -3.5382, "approx": false, "name": "St David's Church", "area": "Exeter", "years": "1952", "text": "David Silver and Anthea Leigh were married in a side chapel here at the end of December 1952, with James as best man.", "links": "<a href=\"../../Bristol-Letters\" target=\"_top\">Letters from Bristol</a> · <a href=\"../../David-Silver/\" target=\"_top\">David Silver</a> · <a href=\"../../Anthea-Silver/\" target=\"_top\">Anthea Silver</a>"}, {"n": 8, "lat": 50.7278, "lon": -3.5187, "approx": true, "name": "The Belmont Nursing Home", "area": "Exeter", "years": "1925, 1928", "text": "Anthea Leigh was born here on 30 April 1928, in \"a beautiful Georgian terrace in Exeter, later destroyed in the blitz\". Position approximate.", "links": "<a href=\"../../A-Topsham-Childhood\" target=\"_top\">A Topsham Childhood</a>"}, {"n": 9, "lat": 50.7233, "lon": -3.5132, "approx": false, "name": "Endsleigh School, Grendon Road", "area": "Exeter", "years": "c.1937–1939", "text": "\"A girls only day school on the corner of Grendon Road\", where Anthea and her sister Mary went until the daylight raids on Exeter.", "links": "<a href=\"../../A-Topsham-Childhood\" target=\"_top\">A Topsham Childhood</a>"}, {"n": 10, "lat": 50.6997, "lon": -3.4921, "approx": false, "name": "Sundew and the garage, Countess Wear", "area": "Countess Wear", "years": "c.1924–1930", "text": "Tom and Edith Leigh's bungalow and garage on the Countess Wear crossroads, where Anthea was brought home as a baby.", "links": "<a href=\"../../A-Topsham-Childhood\" target=\"_top\">A Topsham Childhood</a>"}, {"n": 11, "lat": 50.6886, "lon": -3.4675, "approx": false, "name": "Denver House and Denver Nurseries, Denver Road", "area": "Topsham", "years": "c.1901–1940s", "text": "Thomas Bolt Pyne's house and fruit-tree nursery, employing about thirty men: Anthea's grandparents' home, \"big, comfortable and secure\".", "links": "<a href=\"../../A-Topsham-Childhood\" target=\"_top\">A Topsham Childhood</a>"}, {"n": 12, "lat": 50.688, "lon": -3.4685, "approx": true, "name": "Meadow Hayes", "area": "Topsham", "years": "1935–1946", "text": "Anthea's childhood home, in the meadow opposite Denver Nurseries, until the family left in 1946. \"I still dream about Meadow Hayes.\"", "links": "<a href=\"../../A-Topsham-Childhood\" target=\"_top\">A Topsham Childhood</a>"}, {"n": 13, "lat": 50.6888, "lon": -3.4709, "approx": true, "name": "Park Field, by the Exeter Road", "area": "Topsham", "years": "1934–35", "text": "A sewer trench cut through Park Field, opposite the Pyne nurseries, turned up Romano-British pottery, coins and glass.", "links": "<a href=\"../../Denver-Excavation\" target=\"_top\">Romano-British Antiquities</a>"}, {"n": 14, "lat": 50.6809, "lon": -3.4642, "approx": false, "name": "\"Doone\", Monmouth Hill", "area": "Topsham", "years": "c.1932–1935", "text": "The Leighs' semi-detached house with a long front garden, where Anthea's sister Gillian was born.", "links": "<a href=\"../../A-Topsham-Childhood\" target=\"_top\">A Topsham Childhood</a>"}, {"n": 15, "lat": 50.6804, "lon": -3.4644, "approx": false, "name": "The Strand", "area": "Topsham", "years": "1930s", "text": "Anthea's father worked at Mr Seldon's garage on the Strand, and her godmother Peggy Dolling lived here.", "links": "<a href=\"../../A-Topsham-Childhood\" target=\"_top\">A Topsham Childhood</a>"}, {"n": 16, "lat": 50.6827, "lon": -3.4659, "approx": false, "name": "St Margaret's Church", "area": "Topsham", "years": "1930s–40s", "text": "\"The church was the centre of the community\": Anthea sang in the choir here for years.", "links": "<a href=\"../../A-Topsham-Childhood\" target=\"_top\">A Topsham Childhood</a>"}, {"n": 17, "lat": 50.6845, "lon": -3.4645, "approx": true, "name": "Rosapenna", "area": "Topsham", "years": "1921–1941", "text": "Rupert Philip Acott moved to Rosapenna in Topsham after his wife died, and lived there until his death in 1941. Exact location not yet found.", "links": "<a href=\"../../Acott-Family/#rupert-philip-acott-18531941-and-charlotte-rowell\" target=\"_top\">The Acott Family</a>"}];
const map = L.map('map', {scrollWheelZoom: false});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'}).addTo(map);
const b = [];
for (const p of places) {
  const icon = L.divIcon({className: '', html: '<div class="num' + (p.approx ? ' approx' : '') + '">' + p.n + '</div>', iconSize: [30, 30], iconAnchor: [15, 15]});
  L.marker([p.lat, p.lon], {icon, title: p.name}).addTo(map).bindPopup(
    '<h3>' + p.n + '. ' + p.name + '</h3><div class="when">' + p.area + ' · ' + p.years + (p.approx ? ' · position approximate' : '') + '</div>' +
    p.text + (p.links ? '<br><br>' + p.links : ''));
  b.push([p.lat, p.lon]);
}
map.fitBounds(b, {padding: [30, 30]});
</script></body></html>
